<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Handwriting Board</title>
  <style>*, *::before, *::after {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: var(--color-background-primary, #f4f5f7);
  color: var(--color-text-primary, #1f2937);
  font-family: var(--font-sans, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
  font-size: 13px;
  overflow: hidden;
}

.app-shell {
  position: relative;
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  min-height: 460px;
}

.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 6px;
  padding: 7px 10px;
  background: var(--color-background-secondary, #ffffff);
  border-bottom: 1px solid var(--color-border-primary, #e2e8f0);
  flex-shrink: 0;
}

.toolbar-group {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-wrap: wrap;
}

.brand {
  font-weight: 600;
  font-size: 13px;
  margin-right: 2px;
  color: var(--color-text-primary, #111827);
}

select, .btn {
  appearance: none;
  background: var(--color-background-primary, #f8fafc);
  color: var(--color-text-primary, #1f2937);
  border: 1px solid var(--color-border-primary, #cbd5e1);
  border-radius: 6px;
  padding: 4px 8px;
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
  transition: background 0.12s, border-color 0.12s, transform 0.06s;
}

select {
  padding-right: 20px;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%),
    linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 11px) 50%, calc(100% - 6px) 50%;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
}

.btn:hover, select:hover {
  background: var(--color-background-tertiary, #e2e8f0);
}

.btn:active {
  transform: scale(0.97);
}

.btn-primary {
  background: var(--color-background-info, #18349c);
  color: var(--color-text-inverse, #ffffff);
  border-color: transparent;
}

.btn-primary:hover {
  filter: brightness(1.1);
  background: var(--color-background-info, #1e40af);
}

.btn-toggle.active {
  background: rgba(24, 52, 156, 0.12);
  border-color: rgba(24, 52, 156, 0.45);
  color: var(--color-text-info, #18349c);
}

.btn-xs {
  padding: 2px 7px;
  font-size: 11px;
}

.status-pill {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--color-background-tertiary, #eef2ff);
  color: var(--color-text-secondary, #475569);
  white-space: nowrap;
}

.hurry-control, .mini-control {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: var(--color-text-secondary, #475569);
  background: var(--color-background-primary, #f1f5f9);
  border: 1px solid var(--color-border-primary, #e2e8f0);
  border-radius: 6px;
  padding: 2px 7px;
}

.hurry-control input[type="range"],
.mini-control input[type="range"] {
  width: 64px;
  accent-color: #18349c;
  cursor: pointer;
}

.swatches {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 6px;
  border-radius: 6px;
  background: var(--color-background-primary, #f1f5f9);
  border: 1px solid var(--color-border-primary, #e2e8f0);
}

.swatch {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  padding: 0;
  transition: transform 0.1s;
}

.swatch:hover {
  transform: scale(1.15);
}

.swatch.active {
  box-shadow: 0 0 0 2px var(--color-ring-primary, #3b82f6);
}

.stage-wrap {
  flex: 1;
  min-height: 0;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px;
  background: var(--color-background-primary, #e5e7eb);
}

.stage-wrap.tall-mode {
  overflow: auto;
  align-items: flex-start;
}

.canvas-frame {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.stage-wrap.tall-mode .canvas-frame {
  height: auto;
  align-items: flex-start;
}

#board-canvas {
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  border-radius: 8px;
  box-shadow: 0 8px 28px rgba(15, 23, 42, 0.16), 0 0 0 1px rgba(15, 23, 42, 0.08);
  cursor: crosshair;
  touch-action: none;
  display: block;
}

#board-canvas.tall-mode {
  max-height: none;
  width: min(100%, 1080px);
  height: auto;
}

/* --- Built-in local text composer --- */
.composer {
  display: flex;
  align-items: stretch;
  gap: 8px;
  padding: 8px 10px;
  background: var(--color-background-secondary, #ffffff);
  border-top: 1px solid var(--color-border-primary, #e2e8f0);
  flex-shrink: 0;
}

.composer.hidden {
  display: none;
}

#text-input {
  flex: 1;
  min-width: 180px;
  resize: vertical;
  min-height: 60px;
  max-height: 180px;
  padding: 7px 9px;
  border-radius: 6px;
  border: 1px solid var(--color-border-primary, #cbd5e1);
  background: var(--color-background-primary, #f8fafc);
  color: var(--color-text-primary, #111827);
  font-family: inherit;
  font-size: 13px;
  line-height: 1.38;
  outline: none;
}

#text-input:focus {
  border-color: var(--color-ring-primary, #18349c);
  box-shadow: 0 0 0 2px rgba(24, 52, 156, 0.15);
}

.composer-side {
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 6px;
  flex-shrink: 0;
}

.composer-row {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-wrap: wrap;
}

@media (max-width: 680px) {
  .composer {
    flex-direction: column;
  }
}

/* --- Transparent PNG export preview / fallback toast --- */
.export-toast {
  position: absolute;
  right: 14px;
  bottom: 96px;
  width: min(380px, calc(100% - 28px));
  background: var(--color-background-secondary, #ffffff);
  border: 1px solid var(--color-border-primary, #cbd5e1);
  border-radius: 10px;
  box-shadow: 0 14px 36px rgba(15, 23, 42, 0.25);
  z-index: 40;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

.export-toast.hidden {
  display: none;
}

.export-toast-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 10px;
  font-size: 12px;
  font-weight: 600;
  border-bottom: 1px solid var(--color-border-primary, #e2e8f0);
}

.export-preview-checker {
  max-height: 220px;
  overflow: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px;
  background-color: #f8fafc;
  background-image:
    linear-gradient(45deg, #e2e8f0 25%, transparent 25%),
    linear-gradient(-45deg, #e2e8f0 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, #e2e8f0 75%),
    linear-gradient(-45deg, transparent 75%, #e2e8f0 75%);
  background-size: 14px 14px;
  background-position: 0 0, 0 7px, 7px -7px, -7px 0;
}

#export-preview-img {
  max-width: 100%;
  max-height: 195px;
  object-fit: contain;
  display: block;
}

.export-toast-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 10px;
  border-top: 1px solid var(--color-border-primary, #e2e8f0);
  flex-wrap: wrap;
}

.export-hint {
  font-size: 11px;
  color: var(--color-text-secondary, #64748b);
}

.export-toast-actions {
  display: flex;
  align-items: center;
  gap: 5px;
}
</style>
</head>
<body>
  <div class="app-shell">
    <header class="toolbar">
      <div class="toolbar-group">
        <span class="brand" id="board-title">Доска</span>
        <select id="surface-select" title="Поверхность доски">
          <option value="paper">Лист в точку</option>
          <option value="whiteboard">Маркерная доска</option>
          <option value="notebook">Тетрадь в клетку</option>
          <option value="lined">Линейка</option>
          <option value="chalkboard">Школьная доска</option>
        </select>
        <span class="status-pill" id="status-pill">Готово</span>
        <label class="hurry-control" title="Спешка: 0% старательно (v4) — 100% на бегу">
          <span>Спешка</span>
          <input type="range" id="hurry-slider" min="0" max="100" value="50" />
          <span id="hurry-val">50%</span>
        </label>
      </div>

      <div class="toolbar-group">
        <div class="swatches" id="color-swatches" title="Цвет чернил (для текста и рисования)">
          <button class="swatch active" data-color="#1d31a8" style="background:#1d31a8" aria-label="Синий Noteshelf"></button>
          <button class="swatch" data-color="#1e293b" style="background:#1e293b" aria-label="Чёрный"></button>
          <button class="swatch" data-color="#dc2626" style="background:#dc2626" aria-label="Красный"></button>
          <button class="swatch" data-color="#15803d" style="background:#15803d" aria-label="Зелёный"></button>
          <button class="swatch" data-color="#f8fafc" style="background:#f8fafc;border-color:#94a3b8" aria-label="Белый мел"></button>
        </div>
        <button class="btn btn-toggle active" id="btn-toggle-composer" title="Показать/скрыть поле ввода текста">✏️ Текст</button>
        <button class="btn" id="btn-replay" title="Повторить анимацию письма">▶</button>
        <button class="btn" id="btn-speed" title="Скорость анимации">1x</button>
        <button class="btn" id="btn-undo" title="Отменить последнее">↩</button>
        <button class="btn" id="btn-clear" title="Очистить доску">🗑</button>
        <button class="btn" id="btn-copy-png" title="Скопировать PNG без фона в буфер обмена (Ctrl+V)">📋 Без фона</button>
        <button class="btn btn-primary" id="btn-export-transparent" title="Экспортировать PNG без фона (прозрачный, обрезанный по тексту, 3x)">⬇ PNG без фона</button>
      </div>
    </header>

    <main class="stage-wrap" id="stage-wrap">
      <div class="canvas-frame">
        <canvas id="board-canvas"></canvas>
      </div>
    </main>

    <section class="composer" id="composer-panel">
      <textarea
        id="text-input"
        rows="3"
        spellcheck="false"
        placeholder="Введи или вставь текст сюда — сразу напишется твоим почерком без ИИ (Enter — новая строка)..."
      ></textarea>
      <div class="composer-side">
        <div class="composer-row">
          <label class="mini-control" title="Размер букв">
            <span>Размер</span>
            <input type="range" id="size-slider" min="18" max="54" value="27" />
            <span id="size-val">27</span>
          </label>
          <select id="pen-select" title="Тип ручки">
            <option value="ballpoint" selected>Ручка</option>
            <option value="fountain">Перо</option>
            <option value="marker">Маркер</option>
            <option value="pencil">Карандаш</option>
          </select>
        </div>
        <div class="composer-row">
          <button class="btn" id="btn-shuffle" title="Сгенерировать другой вариант кривизны букв (новый seed)">🎲 Вариант</button>
          <button class="btn" id="btn-pull-text" title="Загрузить текущий текст с доски в поле редактирования">↙ С доски</button>
          <button class="btn" id="btn-append-block" title="Зафиксировать этот текст на доске и начать новый блок ниже">➕ Блок</button>
          <button class="btn" id="btn-export-bg" title="Скачать PNG вместе с фоном доски">🖼 С фоном</button>
        </div>
      </div>
    </section>

    <div class="export-toast hidden" id="export-toast" role="dialog" aria-label="Превью прозрачного PNG">
      <div class="export-toast-head">
        <span id="export-toast-title">PNG без фона</span>
        <button class="btn btn-xs" id="btn-close-toast" title="Закрыть">✕</button>
      </div>
      <div class="export-preview-checker">
        <img id="export-preview-img" alt="Прозрачный PNG" />
      </div>
      <div class="export-toast-foot">
        <span class="export-hint" id="export-toast-hint">ПКМ по картинке → Копировать / Сохранить</span>
        <div class="export-toast-actions">
          <button class="btn btn-xs" id="btn-toast-copy">📋 Копировать</button>
          <a class="btn btn-xs btn-primary" id="btn-toast-download" download="handwriting.png">⬇ Скачать</a>
        </div>
      </div>
    </div>
  </div>
