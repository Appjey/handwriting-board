<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Handwriting Board</title>
  <style>*, *::before, *::after {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  background: var(--color-background-primary, #f4f5f7);
  color: var(--color-text-primary, #1f2937);
  font-family: var(--font-sans, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
  font-size: 13px;
  overflow: hidden;
}

.app-shell {
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  min-height: 460px;
}

.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  padding: 8px 12px;
  background: var(--color-background-secondary, #ffffff);
  border-bottom: 1px solid var(--color-border-primary, #e2e8f0);
  flex-shrink: 0;
}

.toolbar-group {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.brand {
  font-weight: 600;
  font-size: 13px;
  margin-right: 4px;
  color: var(--color-text-primary, #111827);
}

select, .btn {
  appearance: none;
  background: var(--color-background-primary, #f8fafc);
  color: var(--color-text-primary, #1f2937);
  border: 1px solid var(--color-border-primary, #cbd5e1);
  border-radius: 6px;
  padding: 4px 9px;
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s, transform 0.06s;
}

select {
  padding-right: 22px;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%),
    linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 12px) 50%, calc(100% - 7px) 50%;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
}

.btn:hover, select:hover {
  background: var(--color-background-tertiary, #e2e8f0);
}

.btn:active {
  transform: scale(0.97);
}

.btn-primary {
  background: var(--color-background-info, #2563eb);
  color: var(--color-text-inverse, #ffffff);
  border-color: transparent;
}

.btn-primary:hover {
  filter: brightness(1.08);
  background: var(--color-background-info, #1d4ed8);
}

.status-pill {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--color-background-tertiary, #eef2ff);
  color: var(--color-text-secondary, #475569);
  white-space: nowrap;
}

.hurry-control {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: var(--color-text-secondary, #475569);
  background: var(--color-background-primary, #f1f5f9);
  border: 1px solid var(--color-border-primary, #e2e8f0);
  border-radius: 6px;
  padding: 2px 7px;
}

.hurry-control input[type="range"] {
  width: 68px;
  accent-color: #18349c;
  cursor: pointer;
}

.swatches {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 6px;
  border-radius: 6px;
  background: var(--color-background-primary, #f1f5f9);
  border: 1px solid var(--color-border-primary, #e2e8f0);
}

.swatch {
  width: 15px;
  height: 15px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  padding: 0;
  transition: transform 0.1s;
}

.swatch:hover {
  transform: scale(1.15);
}

.swatch.active {
  box-shadow: 0 0 0 2px var(--color-ring-primary, #3b82f6);
}

.stage-wrap {
  flex: 1;
  min-height: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px;
  background: var(--color-background-primary, #e5e7eb);
}

.canvas-frame {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

#board-canvas {
  max-width: 100%;
  max-height: 100%;
  aspect-ratio: 3 / 2;
  border-radius: 8px;
  box-shadow: 0 8px 28px rgba(15, 23, 42, 0.16), 0 0 0 1px rgba(15, 23, 42, 0.08);
  cursor: crosshair;
  touch-action: none;
  display: block;
}
</style>
</head>
<body>
  <div class="app-shell">
    <header class="toolbar">
      <div class="toolbar-group">
        <span class="brand" id="board-title">Доска</span>
        <select id="surface-select" title="Поверхность доски">
          <option value="paper">Лист в точку</option>
          <option value="whiteboard">Маркерная доска</option>
          <option value="notebook">Тетрадь в клетку</option>
          <option value="lined">Линейка</option>
          <option value="chalkboard">Школьная доска</option>
        </select>
        <span class="status-pill" id="status-pill">Готово</span>
        <label class="hurry-control" title="Спешка: 0% старательно (v4) — 100% на бегу">
          <span>Спешка</span>
          <input type="range" id="hurry-slider" min="0" max="100" value="50" />
          <span id="hurry-val">50%</span>
        </label>
      </div>

      <div class="toolbar-group">
        <div class="swatches" id="color-swatches" title="Цвет рисования мышкой">
          <button class="swatch active" data-color="#1e293b" style="background:#1e293b" aria-label="Чёрный"></button>
          <button class="swatch" data-color="#1d4ed8" style="background:#1d4ed8" aria-label="Синий"></button>
          <button class="swatch" data-color="#dc2626" style="background:#dc2626" aria-label="Красный"></button>
          <button class="swatch" data-color="#15803d" style="background:#15803d" aria-label="Зелёный"></button>
          <button class="swatch" data-color="#f8fafc" style="background:#f8fafc;border-color:#94a3b8" aria-label="Белый мел"></button>
        </div>
        <button class="btn" id="btn-replay" title="Повторить анимацию письма">▶ Повтор</button>
        <button class="btn" id="btn-speed" title="Скорость анимации">1x</button>
        <button class="btn" id="btn-undo" title="Отменить последнее">↩</button>
        <button class="btn" id="btn-clear" title="Очистить доску">🗑</button>
        <button class="btn btn-primary" id="btn-export" title="Сохранить PNG">PNG</button>
      </div>
    </header>

    <main class="stage-wrap">
      <div class="canvas-frame">
        <canvas id="board-canvas"></canvas>
      </div>
    </main>
  </div>
